allowBuilds:
  esbuild: true

# Blocks resolution of any package version published less than 7 days ago, including transitive dependencies and audit-driven overrides. Mitigates compromised-maintainer / just-published-malicious-version supply chain attacks by giving the ecosystem time to catch a bad release before this repo ever installs it.
minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  # get-tsconfig (a knip transitive) ships registry metadata with no time field, which minimumReleaseAge cannot evaluate — exempt it rather than weakening the age gate itself.
  - get-tsconfig
  # trilean is published from the same maintainer's own repository as this one, so the compromised-maintainer threat the gate guards against does not apply: its releases are reviewed here before adoption rather than waited out.
  - trilean
  # trilean@1.3.0 requires zod ^4.5.4, whose lowest satisfying version is still inside the age window. Exempted at that exact version rather than for zod as a whole, so every other zod release stays gated; drop this entry once 4.5.4 ages past the window.
  - zod@4.5.4
