[workspace]
resolver = "2"
members = ["tests/agent-perms-conformance"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/ExaDev/agent-permissions"

[workspace.dependencies]
# Only the standard library feature is needed (an `Error` that implements `std::error::Error`); the default feature set is that one feature, so it is stated.
serde_json = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
# Binding crates that need wasm-bindgen's generated FFI relax this in their own manifest, not here.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
