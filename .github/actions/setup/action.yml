name: Setup and Run
description: Checkout + pnpm + Node (from .tool-versions, or the node-version input) + frozen install + the CI caches, then run a task.

inputs:
  task:
    description: Task identifier for the step name; selects the eslint cache when the task is lint.
    required: true
  command:
    description: Shell command to execute after install.
    required: true
  node-version:
    description: Node version to install; empty means the .tool-versions file (the repo baseline).
    required: false
    default: ""
  registry-url:
    description: npm registry for setup-node to write into .npmrc; empty leaves it unset (publish to npmjs with OIDC).
    required: false
    default: ""
  fetch-depth:
    description: Passed through to actions/checkout's fetch-depth.
    required: false
    default: "1"
  ref:
    description: Passed through to actions/checkout's ref; empty resolves the triggering ref as normal.
    required: false
    default: ""
  persist-credentials:
    description: Passed through to actions/checkout's persist-credentials; a job that pushes or opens a PR with GITHUB_TOKEN needs this true.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # actions/checkout is the one pin every job in this repo needs, so it lives here rather than as a `uses:` line in any workflow file: GitHub's workflow-scope push restriction on GITHUB_TOKEN is keyed to files under .github/workflows specifically (verified directly against this repo), not the whole .github tree, so a Dependabot bump to this pin lands as a diff scoped to .github/actions/setup/action.yml and GITHUB_TOKEN can merge it -- an actions/checkout bump pinned inside a workflow file could not be.
    - uses: actions/checkout@v7
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.ref }}
        persist-credentials: ${{ inputs.persist-credentials }}

    - uses: pnpm/action-setup@v6.0.10

    - uses: actions/setup-node@v7
      if: inputs.node-version == ''
      with:
        node-version-file: .tool-versions
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - uses: actions/setup-node@v7
      if: inputs.node-version != ''
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - run: pnpm install --frozen-lockfile
      shell: bash

    # Turbo's cache keyed on the inputs that can change a task outcome (lockfile + task graph), with the run id in the primary key so every run saves a fresh entry and restore-keys fall back to the nearest match -- an exact-hit restore on an unchanged dependency graph instead of the old github.sha keys, which could only ever hit via the prefix fallback.
    - name: Restore turbo cache
      uses: actions/cache@v6
      with:
        path: .turbo
        # Node-scoped: turbo's task hashes do not include the node version, so an unscoped key would let one matrix leg replay its cached results on another leg (a plain-test result standing in for the coverage run). The "file" fallback scopes runs that use the .tool-versions baseline.
        key: turbo-${{ runner.os }}-node-${{ inputs.node-version == '' && 'file' || inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.run_id }}
        restore-keys: |
          turbo-${{ runner.os }}-node-${{ inputs.node-version == '' && 'file' || inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
          turbo-${{ runner.os }}-node-${{ inputs.node-version == '' && 'file' || inputs.node-version }}-

    - name: Run ${{ inputs.task }}
      id: run
      run: ${{ inputs.command }}
      shell: bash

# A run step's GITHUB_OUTPUT surfaces through the composite's own outputs, so callers can read steps.<this-action's-id>.outputs.fixed directly.
outputs:
  fixed:
    description: The "fixed" output of the task that ran (audit-autofix), when it sets one.
    value: ${{ steps.run.outputs.fixed }}
