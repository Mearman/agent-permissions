version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - dependencies
    commit-message:
      prefix: build(deps)
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - patch

  - package-ecosystem: github-actions
    # Dependabot's file fetcher only looks for action.yml/action.yaml inside a configured directory itself, it does not walk into subdirectories of "/" looking for composite actions -- the pins inside .github/actions/setup/action.yml (pnpm/action-setup, actions/setup-node, actions/cache) need their own directory entry or Dependabot never proposes a bump for them at all, regardless of what merges GITHUB_TOKEN can perform.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: ci(deps)
    cooldown:
      default-days: 7
