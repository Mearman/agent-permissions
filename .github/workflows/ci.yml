name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Lets the audit job's own fix-PR branch get a real check/test run: a workflow_dispatch call is explicitly exempt from GitHub's rule that events caused by the default GITHUB_TOKEN (a push, a PR opened via `gh pr create`) never trigger another workflow run.
  workflow_dispatch:

# A new push to a PR supersedes that PR's in-flight run; a push to main never cancels, because the audit job's fix-PR poll loop and the release job both make mid-run decisions a cancel would truncate.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-commits:
    name: Lint commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          task: lint-commits
          command: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  audit:
    name: Audit
    runs-on: ubuntu-latest
    # Generous: the fix-PR step polls a dispatched CI run (up to 60 x 20s) after the audit itself.
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      fixed: ${{ steps.audit-setup.outputs.fixed }}
    steps:
      - uses: actions/checkout@v7

      - name: Audit (auto-fix findings with an aged patch, defer the rest)
        id: audit-setup
        uses: ./.github/actions/setup
        with:
          task: audit
          command: node --experimental-strip-types .github/scripts/audit-autofix.ts
        env:
          AUDIT_LEVEL: high

      # Only open a PR from main itself: a PR run has nothing of its own to fix a PR against, and this keeps the fix branch out of branches this workflow doesn't own. Landing the fix through a PR means a bad fix stays off main entirely: the merge below happens only after a full CI run on the fix branch has passed.
      - name: Open a PR with the auto-fixed overrides
        if: steps.audit-setup.outputs.fixed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="audit-autofix/$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pnpm-workspace.yaml pnpm-lock.yaml
          git commit -m "fix(deps): apply aged security overrides

          $(cat /tmp/audit-fix-commit-body.txt)"
          git push origin "$BRANCH"
          gh pr create --title "fix(deps): apply aged security overrides" --body-file /tmp/audit-fix-commit-body.txt --base main --head "$BRANCH"
          # A push authenticated with GITHUB_TOKEN (the git push above, same as opening the PR) never triggers another workflow run on its own — dispatch the fix branch's checks explicitly.
          gh workflow run ci.yml --ref "$BRANCH"
          RUN_ID=""
          for i in 1 2 3 4 5; do
            sleep 10
            RUN_ID=$(gh run list --workflow=ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null)
            if [ -n "$RUN_ID" ]; then break; fi
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::Dispatched CI run for $BRANCH never appeared; fix PR left open for manual merge after review."
            exit 0
          fi
          echo "Waiting for CI run $RUN_ID on $BRANCH..."
          for i in $(seq 1 60); do
            STATUS=$(gh run view "$RUN_ID" --json status,conclusion --jq '.status + ":" + (.conclusion // "pending")' 2>/dev/null || echo "query_failed")
            if [ "$STATUS" = "completed:success" ]; then
              echo "CI green on $BRANCH, rebase-merging the fix PR."
              gh pr merge --rebase "$BRANCH"
              exit 0
            fi
            if [ "$STATUS" = "completed:failure" ] || [ "$STATUS" = "completed:cancelled" ]; then
              echo "::error::CI on $BRANCH concluded $STATUS; fix PR left open so a broken fix cannot reach main."
              exit 0
            fi
            echo "CI on $BRANCH still pending ($i/60)..."
            sleep 20
          done
          echo "::error::Timed out waiting for CI run $RUN_ID on $BRANCH; fix PR left open."
          exit 0

  check:
    name: Check
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Workflow YAML linting: two shell/YAML-level bugs in these workflows were found by actionlint run by hand during a CI debugging session; nothing in CI checked them until now.
      - name: Lint workflow YAML (actionlint)
        run: |
          VERSION="1.7.7"
          curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash" | bash -s -- "$VERSION"
          ./actionlint -color

      - uses: ./.github/actions/setup
        with:
          task: check
          command: pnpm check

      # `pnpm check` builds inside _check, so a stale committed schema (a src/schema.ts edit committed without a rebuild) shows up as a diff here rather than shipping silently. Dependencies are already installed by the composite above, so the remaining gates are plain steps.
      - name: Committed JSON Schema is fresh
        run: git diff --exit-code agent-permissions.schema.json

      - name: knip
        run: pnpm exec knip

      - name: Package checks (publint, attw, dist smoke)
        run: pnpm pkgcheck

  test:
    name: Test — Node ${{ matrix.node-version }}
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # The LTS floor runs the plain suite; the newest release runs the coverage-gated variant, so the 80% thresholds are enforced in CI and not only when someone remembers locally.
          - node-version: 24
            command: pnpm test
          - node-version: 26
            command: pnpm test:coverage
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          task: test-node-${{ matrix.node-version }}
          command: ${{ matrix.command }}
          node-version: '${{ matrix.node-version }}'

  release:
    name: Release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, test]
    runs-on: ubuntu-latest
    # Serialises release runs: two pushes landing close together otherwise race two semantic-release runs against the same next version, changelog commit, and npm publish. Never cancel mid-release — an interrupted cascade leaves published packages without their dependents' bumps.
    concurrency:
      group: release
      cancel-in-progress: false
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      released: ${{ steps.detect-release.outputs.released }}
      tag: ${{ steps.detect-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          task: build
          command: pnpm build

      - name: Release
        id: detect-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
        run: |
          pnpm exec semantic-release 2>&1 | tee release-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if grep -q "Published release" release-output.txt; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          # || true because the runner's default bash -e kills the script on a failing command substitution, and a no-release re-run legitimately has no tag line to find -- the step's exit must remain semantic-release's own.
          TAG=$(grep -oP 'Created tag \Kv[0-9]+\.[0-9]+\.[0-9]+' release-output.txt || true)
          if [ -n "$TAG" ]; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
          exit "$EXIT_CODE"

      - name: Upload schema to release
        if: steps.detect-release.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(grep -oP 'Created tag \Kv[0-9]+\.[0-9]+\.[0-9]+' release-output.txt)
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" agent-permissions.schema.json --clobber
            EXISTING=$(gh release view "$TAG" --json body --jq '.body')
            SCHEMA_URL="https://github.com/Mearman/agent-permissions/releases/download/${TAG}/agent-permissions.schema.json"
            {
              echo "$EXISTING"
              echo ""
              echo "---"
              echo ""
              echo "**Schema:** [${TAG}/agent-permissions.schema.json](${SCHEMA_URL})"
            } > /tmp/release-body.md
            gh release edit "$TAG" --notes-file /tmp/release-body.md
          fi

  publish-npm-aliases:
    name: Publish npm alias — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - name: agents-permissions
          - name: agents-spec
          - name: agent-permissions-policy
          - name: permissions-mcp
          - name: permission-mcp
    permissions:
      id-token: write
    steps:
      # The release tag, not main: a push landing between the release job finishing and this job starting would otherwise build newer source and publish it under the just-tagged version.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          task: build
          command: pnpm build

      - name: Publish
        run: |
          npm pkg set name=${{ matrix.name }}
          # Idempotent re-runs: if this alias version already exists in the registry (a partially-failed prior run), skip rather than collide.
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${{ matrix.name }}@${VERSION}" version >/dev/null 2>&1; then
            echo "${{ matrix.name }}@${VERSION} already published; skipping."
            exit 0
          fi
          pnpm publish --access public --no-git-checks --provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-github-packages:
    name: Publish to GitHub Packages — @mearman/agent-perms
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          task: build
          command: pnpm build
          registry-url: https://npm.pkg.github.com

      - name: Publish
        run: |
          npm pkg set name=@mearman/agent-perms
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@mearman/agent-perms@${VERSION}" version >/dev/null 2>&1; then
            echo "@mearman/agent-perms@${VERSION} already published; skipping."
            exit 0
          fi
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
