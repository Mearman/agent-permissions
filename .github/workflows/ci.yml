name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  lint-commits:
    name: Lint commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        run: |
          pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level high

  check:
    name: Check
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm check

  test:
    name: Test — Node ${{ matrix.node-version }}
    needs: audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 22
          - 24
          - 26
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm test

  release:
    name: Release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, test]
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.detect-release.outputs.released }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm
          # Do NOT set registry-url — it creates an .npmrc that overrides OIDC

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm build

      - name: Release
        id: detect-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
        run: |
          pnpm exec semantic-release 2>&1 | tee release-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if grep -q "Published release" release-output.txt; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          exit $EXIT_CODE

      - name: Upload schema to release
        if: steps.detect-release.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(grep -oP 'Created tag \Kv[0-9]+\.[0-9]+\.[0-9]+' release-output.txt)
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" agent-permissions.schema.json --clobber
            EXISTING=$(gh release view "$TAG" --json body --jq '.body')
            SCHEMA_URL="https://github.com/Mearman/agent-permissions/releases/download/${TAG}/agent-permissions.schema.json"
            {
              echo "$EXISTING"
              echo ""
              echo "---"
              echo ""
              echo "**Schema:** [${TAG}/agent-permissions.schema.json](${SCHEMA_URL})"
            } > /tmp/release-body.md
            gh release edit "$TAG" --notes-file /tmp/release-body.md
          fi

  publish-npm-aliases:
    name: Publish npm alias — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      matrix:
        include:
          - name: agents-permissions
          - name: agents-spec
          - name: agent-permissions-policy
          - name: agent-permissions-mcp
          - name: permissions-mcp
          - name: permission-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: pnpm/action-setup@v6.0.5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm
          # Do NOT set registry-url — it creates an .npmrc that overrides OIDC

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Publish
        run: |
          npm pkg set name=${{ matrix.name }}
          pnpm publish --access public --no-git-checks --provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-github-packages:
    name: Publish to GitHub Packages — @mearman/agent-perms
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: pnpm/action-setup@v6.0.5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Publish
        run: |
          npm pkg set name=@mearman/agent-perms
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
