name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A new push to a PR supersedes that PR's in-flight run; a push to main never cancels, because the release job makes mid-run decisions a cancel would truncate.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-commits:
    name: Lint commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          task: lint-commits
          command: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Fails on any high-severity advisory. Fixing one is a decision for a person or Dependabot: an override that clears it is a pull request to write and review, not something the pipeline opens itself.
      - uses: ./.github/actions/setup
        with:
          task: audit
          command: pnpm audit --audit-level high

  check:
    name: Check
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Workflow YAML linting: two shell/YAML-level bugs in these workflows were found by actionlint run by hand during a CI debugging session; nothing in CI checked them until now.
      - name: Lint workflow YAML (actionlint)
        run: |
          VERSION="1.7.7"
          curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash" | bash -s -- "$VERSION"
          ./actionlint -color

      - uses: ./.github/actions/setup
        with:
          task: check
          command: pnpm check

      # `pnpm check` builds inside _check, so a stale committed schema (a src/schema.ts edit committed without a rebuild) shows up as a diff here rather than shipping silently. Dependencies are already installed by the composite above, so the remaining gates are plain steps.
      - name: Committed JSON Schema is fresh
        run: git diff --exit-code agent-permissions.schema.json

      - name: knip
        run: pnpm exec knip

      - name: Package checks (publint, attw, dist smoke)
        run: pnpm pkgcheck

  test:
    name: Test — Node ${{ matrix.node-version }}
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # The LTS floor runs the plain suite; the newest release runs the coverage-gated variant, so the 80% thresholds are enforced in CI and not only when someone remembers locally.
          - node-version: 24
            command: pnpm test
          - node-version: 26
            command: pnpm test:coverage
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          task: test-node-${{ matrix.node-version }}
          command: ${{ matrix.command }}
          node-version: "${{ matrix.node-version }}"

  release:
    name: Release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, test]
    runs-on: ubuntu-latest
    # Serialises release runs: two pushes landing close together otherwise race two semantic-release runs against the same next version, changelog commit, and npm publish. Never cancel mid-release — an interrupted cascade leaves published packages without their dependents' bumps.
    concurrency:
      group: release
      cancel-in-progress: false
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      released: ${{ steps.detect-release.outputs.released }}
      tag: ${{ steps.detect-release.outputs.tag }}
    steps:
      # Checked out over SSH with a write deploy key, which the main ruleset lets bypass: semantic-release pushes the changelog and version commit and the tag straight to main, and the workflow token cannot. The GitHub release itself is made through the API with the workflow token. See CONTRIBUTING.md.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: ./.github/actions/setup
        with:
          task: build
          command: pnpm build

      - name: Release
        id: detect-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
        run: |
          pnpm exec semantic-release 2>&1 | tee release-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if grep -q "Published release" release-output.txt; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          # || true because the runner's default bash -e kills the script on a failing command substitution, and a no-release re-run legitimately has no tag line to find -- the step's exit must remain semantic-release's own.
          TAG=$(grep -oP 'Created tag \Kv[0-9]+\.[0-9]+\.[0-9]+' release-output.txt || true)
          if [ -n "$TAG" ]; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
          exit "$EXIT_CODE"

      - name: Upload schema to release
        if: steps.detect-release.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(grep -oP 'Created tag \Kv[0-9]+\.[0-9]+\.[0-9]+' release-output.txt)
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" agent-permissions.schema.json --clobber
            EXISTING=$(gh release view "$TAG" --json body --jq '.body')
            SCHEMA_URL="https://github.com/Mearman/agent-permissions/releases/download/${TAG}/agent-permissions.schema.json"
            {
              echo "$EXISTING"
              echo ""
              echo "---"
              echo ""
              echo "**Schema:** [${TAG}/agent-permissions.schema.json](${SCHEMA_URL})"
            } > /tmp/release-body.md
            gh release edit "$TAG" --notes-file /tmp/release-body.md
          fi

  publish-npm-aliases:
    name: Publish npm alias — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - name: agents-permissions
          - name: agents-spec
          - name: agent-permissions-policy
          - name: permissions-mcp
          - name: permission-mcp
    permissions:
      id-token: write
    steps:
      # The release tag, not main: a push landing between the release job finishing and this job starting would otherwise build newer source and publish it under the just-tagged version.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          task: build
          command: pnpm build

      - name: Publish
        run: |
          npm pkg set name=${{ matrix.name }}
          # Idempotent re-runs: if this alias version already exists in the registry (a partially-failed prior run), skip rather than collide.
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${{ matrix.name }}@${VERSION}" version >/dev/null 2>&1; then
            echo "${{ matrix.name }}@${VERSION} already published; skipping."
            exit 0
          fi
          pnpm publish --access public --no-git-checks --provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-github-packages:
    name: Publish to GitHub Packages — @mearman/agent-perms
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          task: build
          command: pnpm build
          registry-url: https://npm.pkg.github.com

      - name: Publish
        run: |
          npm pkg set name=@mearman/agent-perms
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@mearman/agent-perms@${VERSION}" version >/dev/null 2>&1; then
            echo "@mearman/agent-perms@${VERSION} already published; skipping."
            exit 0
          fi
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
