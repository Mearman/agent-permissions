name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Lets the audit job's own fix-PR branch get a real check/test run: a workflow_dispatch call is explicitly exempt from GitHub's rule that events caused by the default GITHUB_TOKEN (a push, a PR opened via `gh pr create`) never trigger another workflow run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-commits:
    name: Lint commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        run: |
          pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  audit:
    name: Audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      fixed: ${{ steps.audit-fix.outputs.fixed }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit (auto-fix findings with an aged patch, defer the rest)
        id: audit-fix
        run: node --experimental-strip-types .github/scripts/audit-autofix.ts
        env:
          AUDIT_LEVEL: high

      # Only open a PR from main itself: a PR run has nothing of its own to fix a PR against, and this keeps the fix branch out of branches this workflow doesn't own. Landing the fix through a PR means a bad fix stays off main entirely: the merge below happens only after a full CI run on the fix branch has passed. Required-status-check branch protection would block bad merges for every PR, but on a personal repo it also blocks the release job's own push (GITHUB_TOKEN has no bypass actor available outside an org), so the gate lives here instead: dispatch CI on the fix branch, wait for its result, rebase-merge only on green, and leave the PR open for a human on anything less.
      - name: Open a PR with the auto-fixed overrides
        if: steps.audit-fix.outputs.fixed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="audit-autofix/$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json pnpm-lock.yaml
          git commit -m "fix(deps): apply aged security overrides

          $(cat /tmp/audit-fix-commit-body.txt)"
          git push origin "$BRANCH"
          gh pr create --title "fix(deps): apply aged security overrides" --body-file /tmp/audit-fix-commit-body.txt --base main --head "$BRANCH"
          # A push authenticated with GITHUB_TOKEN (the git push above, same as opening the PR) never triggers another workflow run on its own — dispatch the fix branch's checks explicitly.
          gh workflow run ci.yml --ref "$BRANCH"
          RUN_ID=""
          for i in 1 2 3 4 5; do
            sleep 10
            RUN_ID=$(gh run list --workflow=ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null)
            if [ -n "$RUN_ID" ]; then break; fi
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::Dispatched CI run for $BRANCH never appeared; fix PR left open for manual merge after review."
            exit 0
          fi
          echo "Waiting for CI run $RUN_ID on $BRANCH..."
          for i in $(seq 1 60); do
            STATUS=$(gh run view "$RUN_ID" --json status,conclusion --jq '.status + ":" + (.conclusion // "pending")' 2>/dev/null || echo "query_failed")
            if [ "$STATUS" = "completed:success" ]; then
              echo "CI green on $BRANCH, rebase-merging the fix PR."
              gh pr merge --rebase "$BRANCH"
              exit 0
            fi
            if [ "$STATUS" = "completed:failure" ] || [ "$STATUS" = "completed:cancelled" ]; then
              echo "::error::CI on $BRANCH concluded $STATUS; fix PR left open so a broken fix cannot reach main."
              exit 0
            fi
            echo "CI on $BRANCH still pending ($i/60)..."
            sleep 20
          done
          echo "::error::Timed out waiting for CI run $RUN_ID on $BRANCH; fix PR left open."
          exit 0

  check:
    name: Check
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm check

  test:
    name: Test — Node ${{ matrix.node-version }}
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version:
          - 22
          - 24
          - 26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm test

  release:
    name: Release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      released: ${{ steps.detect-release.outputs.released }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          # Do NOT set registry-url — it creates an .npmrc that overrides OIDC

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm build

      - name: Release
        id: detect-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
        run: |
          pnpm exec semantic-release 2>&1 | tee release-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if grep -q "Published release" release-output.txt; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$EXIT_CODE"

      - name: Upload schema to release
        if: steps.detect-release.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(grep -oP 'Created tag \Kv[0-9]+\.[0-9]+\.[0-9]+' release-output.txt)
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" agent-permissions.schema.json --clobber
            EXISTING=$(gh release view "$TAG" --json body --jq '.body')
            SCHEMA_URL="https://github.com/Mearman/agent-permissions/releases/download/${TAG}/agent-permissions.schema.json"
            {
              echo "$EXISTING"
              echo ""
              echo "---"
              echo ""
              echo "**Schema:** [${TAG}/agent-permissions.schema.json](${SCHEMA_URL})"
            } > /tmp/release-body.md
            gh release edit "$TAG" --notes-file /tmp/release-body.md
          fi

  publish-npm-aliases:
    name: Publish npm alias — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      matrix:
        include:
          - name: agents-permissions
          - name: agents-spec
          - name: agent-permissions-policy
          - name: agent-permissions-mcp
          - name: permissions-mcp
          - name: permission-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          # Do NOT set registry-url — it creates an .npmrc that overrides OIDC

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Publish
        run: |
          npm pkg set name=${{ matrix.name }}
          pnpm publish --access public --no-git-checks --provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-github-packages:
    name: Publish to GitHub Packages — @mearman/agent-perms
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Publish
        run: |
          npm pkg set name=@mearman/agent-perms
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
