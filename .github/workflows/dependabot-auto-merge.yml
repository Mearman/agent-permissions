name: Dependabot auto-merge

on:
  pull_request:
    types: [opened]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write
  actions: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Find Dependabot PRs
        id: find-prs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "numbers=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            NUMBERS=$(gh pr list --author "dependabot[bot]" --state open --json number --jq '.[].number' | tr '\n' ' ')
            echo "numbers=$NUMBERS" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for CI and merge
        if: steps.find-prs.outputs.numbers != ''
        run: |
          MERGED=0
          for PR in ${{ steps.find-prs.outputs.numbers }}; do
            echo "Processing PR #$PR..."

            # `gh pr checks` reports its verdict in the exit code, not the output: 0 means every check passed, 8 means some are still pending, and anything else means at least one failed. Grepping the output for a verdict phrase the command never prints means no green PR is ever recognised — the loop just burns its whole polling budget on a PR whose checks have already passed.
            for i in $(seq 1 60); do
              gh pr checks "$PR" >/dev/null 2>&1
              CHECK_STATUS=$?
              if [ "$CHECK_STATUS" -eq 0 ]; then
                echo "CI passed on PR #$PR, checking dependency age..."
                node --experimental-strip-types .github/scripts/check-dependency-age.ts "$PR"
                AGE_STATUS=$?
                if [ "$AGE_STATUS" -eq 1 ]; then
                  echo "PR #$PR bumps a package published within the last 7 days, skipping until it ages out."
                  continue 2
                elif [ "$AGE_STATUS" -ne 0 ]; then
                  echo "::error::Dependency age check failed unexpectedly for PR #$PR (exit $AGE_STATUS) — skipping without merging, needs investigation."
                  continue 2
                fi
                echo "PR #$PR passed the age check, merging."
                # A pull request whose diff edits anything under .github/workflows — which is what every GitHub-Actions version bump is — cannot be merged by the default token at all: `workflows` is a PAT/App permission with no GITHUB_TOKEN scope, so GitHub refuses the merge outright. That is a known, structural skip, not a failure: leave it open for a human (or a PAT-secret-backed rerun) and keep sweeping the rest.
                if gh pr merge --rebase "$PR" 2>&1 | tee "/tmp/merge-$PR.log"; then
                  MERGED=1
                  continue 2
                fi
                if grep -q "without .workflows. permission" "/tmp/merge-$PR.log"; then
                  echo "::warning::PR #$PR edits workflow files, which the default token can never merge — left open for a human merge."
                  continue 2
                fi
                echo "::error::merging PR #$PR failed unexpectedly; left open for inspection."
                continue 2
              fi
              if [ "$CHECK_STATUS" -ne 8 ]; then
                echo "CI failed on PR #$PR (gh pr checks exit $CHECK_STATUS), skipping."
                continue 2
              fi
              echo "Checks pending on PR #$PR... ($i/60)"
              sleep 30
            done

            echo "Timed out waiting for CI on PR #$PR, skipping."
          done

          # A GITHUB_TOKEN-authenticated merge produces a push to main that GitHub's anti-recursion rule refuses to cascade into ci.yml's own `push` trigger, so a merged bump would otherwise sit released-in-git-but-not-published until the next human push happens to fire CI. workflow_dispatch is the one event type that rule exempts, so it is dispatched explicitly whenever this run merged anything.
          if [ "$MERGED" -eq 1 ]; then
            echo "Dispatching ci.yml on main to release the merged bump(s)."
            gh workflow run ci.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
