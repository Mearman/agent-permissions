name: _probe token scope
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
permissions:
  contents: write
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --rebase "${{ inputs.pr }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
